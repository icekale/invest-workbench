<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111f27" />
      <stop offset="60%" stop-color="#162a34" />
      <stop offset="100%" stop-color="#0c232b" />
    </linearGradient>
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e4b2" />
      <stop offset="50%" stop-color="#dfb56d" />
      <stop offset="100%" stop-color="#ba8c3f" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#fav-bg)" />
  <rect x="1" y="1" width="30" height="30" rx="7" stroke="url(#fav-gold)" stroke-width="1.2" stroke-opacity="0.9" />

  <!-- Wave Body Fill -->
  <path
    d="M4 21 C 8 21, 10 16.5, 14.5 16.5 C 18.5 16.5, 20.5 19.5, 24.5 19.5 C 26.5 19.5, 27.5 19, 28 18.5 L 28 24 C 28 26.2, 26.2 28, 24 28 L 8 28 C 5.8 28, 4 26.2, 4 24 Z"
    fill="#0d706d"
    fill-opacity="0.55"
  />

  <!-- Crisp Crest Line (Wave / 澜) -->
  <path
    d="M4 20.5 C 8.5 20.5, 11 14.5, 15 14.5 C 18.5 14.5, 21 18.5, 25 18.5 C 26.5 18.5, 27.2 18, 28 17.5"
    stroke="url(#fav-gold)"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Horizon Line (Anchor / 定力) -->
  <path
    d="M6 23.5 C 10 23.5, 13 22, 17 22 C 21 22, 23 23.5, 26 23.5"
    stroke="url(#fav-gold)"
    stroke-width="1"
    stroke-linecap="round"
    stroke-opacity="0.8"
  />

  <!-- Polaris Star (Guidance) -->
  <circle cx="22" cy="9.5" r="1.2" fill="#fff" />
  <path d="M22 6.5 L22 12.5 M19 9.5 L25 9.5" stroke="url(#fav-gold)" stroke-width="0.8" stroke-linecap="round" />
</svg>
