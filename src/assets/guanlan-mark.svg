<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Night Harbor Gradient -->
    <linearGradient id="gl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111f27" />
      <stop offset="50%" stop-color="#162a34" />
      <stop offset="100%" stop-color="#0c232b" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="gl-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a9" />
      <stop offset="45%" stop-color="#dfb56d" />
      <stop offset="100%" stop-color="#af8239" />
    </linearGradient>

    <!-- Teal Wave Gradient -->
    <linearGradient id="gl-teal-wave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d706d" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#16815f" stop-opacity="0.6" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <radialGradient id="gl-glow" cx="70%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#dfb56d" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#162a34" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Base with Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#gl-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#gl-glow)" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#gl-gold)" stroke-width="1.5" stroke-opacity="0.85" />

  <!-- Inner Ambient Horizon Grid Hint -->
  <line x1="8" y1="41" x2="56" y2="41" stroke="#dfb56d" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Deep Wave (Secondary Layer) -->
  <path
    d="M8 43 C 16 43, 20 34, 28 34 C 36 34, 40 40, 48 40 C 52 40, 54 39, 56 38 L 56 48 C 56 52, 52 56, 48 56 L 16 56 C 11.5 56, 8 52.5, 8 48 Z"
    fill="url(#gl-teal-wave)"
  />

  <!-- Primary Wave Line (The Surge / 澜) -->
  <path
    d="M10 41 C 18 41, 23 29, 31 29 C 38 29, 43 37, 50 37 C 53 37, 54.5 36.2, 56 35"
    stroke="url(#gl-gold)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Horizon Solid Baseline (The Anchor / 定力) -->
  <path
    d="M14 47 C 22 47, 26 44, 34 44 C 42 44, 47 47, 52 47"
    stroke="url(#gl-gold)"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-opacity="0.7"
  />

  <!-- Zenith Star (Polaris / 锚定方向) -->
  <g transform="translate(44, 19)">
    <circle cx="0" cy="0" r="1.8" fill="#fff" />
    <path d="M0 -4 L0 4 M-4 0 L4 0" stroke="url(#gl-gold)" stroke-width="0.9" stroke-linecap="round" />
  </g>
</svg>
